<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>逃げる。</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7ecd2">
<!-- 公開サイト（HTTP配信）では cup/ に飛ぶ。file:// で開いたときだけ下の script が cup/index.html に振り直す -->
<meta http-equiv="refresh" content="0; url=cup/">
<style>
html,body{height:100%;margin:0}
body{background:#f7ecd2;color:#2b2118;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
h1{font-size:22px;margin:0}
p{font-size:14px;opacity:.7;margin:0}
a{display:block;padding:18px 20px;background:#fff8;border-radius:14px;color:inherit;text-decoration:none;font-size:20px;min-width:min(100%,360px)}
small{display:block;font-size:13px;opacity:.7;margin-top:4px}
</style>
</head>
<body>
<h1>逃げる。</h1>
<p>ゲームへ移動しています…</p>
<a href="cup/index.html">コップ、逃げる。<small>逃げる。シリーズ 01 — 猫の手から60秒逃げ切る</small></a>
<script>
// file:// ではディレクトリ URL（cup/）がファイル一覧になってしまうので index.html を直接指す
if (location.protocol === 'file:') location.replace('cup/index.html');
</script>
</body>
</html>
